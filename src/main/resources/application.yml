server:
  servlet:
    context-path: /cliente-endereco/api

cep:
  api:
    base-url: ${CEP_API_BASE_URL:http://localhost:8081/api/enderecos}

spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/cliente_endereco}
    username: ${DATASOURCE_USER:postgres}
    password: ${DATASOURCE_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html