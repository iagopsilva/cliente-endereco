services:
  postgres_container:
    image: postgres:17
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cliente_endereco
    volumes:
      - postgres_data:/var/lib/postgresql/data

  wiremock:
    image: wiremock/wiremock:latest
    container_name: wiremock_api_externa
    ports:
      - "8081:8080" # Expõe na porta 8081 para não conflitar com seu Spring Boot
    volumes:
      - ./wiremock-data:/home/wiremock

volumes:
  postgres_data: